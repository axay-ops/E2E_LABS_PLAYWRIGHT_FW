# ========================================================================================
#                              DOCKER-BASED TEST EXECUTION
# ========================================================================================
# Trigger: Manual workflow_dispatch / Push / PR / Scheduled
# Workflow: Pull Docker Image → Run Tests → Publish Reports → Notifications
# ✅ Uses pre-built Docker image from Docker Hub (no build time)
# ✅ Decryption keys from GitHub Secrets
# ✅ Reports published to GitHub Pages
# ✅ Slack & Email notifications
# ========================================================================================

name: Docker Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

      test_suite:
        description: 'Test Suite to Run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all
          - specific

      test_file:
        description: 'Specific test file (only if "specific" selected)'
        required: false
        default: './tests/loginpage.spec.ts'
        type: string

      docker_image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'latest'
        type: string

  push:
    branches:
      - main
    paths:
      - 'tests/**'
      - '.github/workflows/docker-tests.yml'

  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC

env:
  # 🔄 UPDATE THIS: Replace with your Docker Hub username/image
  DOCKER_IMAGE: axayhub/e2e-labs-playwright-fw-hubrepo
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Docker-Based Test Execution
  # ============================================
  docker-test:
    name: 🐳 Docker Tests - ${{ github.event.inputs.environment || 'qa' }}
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo (for uploading reports later)
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub (optional, needed for private images)
      - name: 🔐 Login to Docker Hub
        if: ${{ secrets.DOCKER_HUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 3️⃣ Pull Docker image from Docker Hub
      - name: 🐳 Pull Docker Image
        run: |
          echo "Pulling image: ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.docker_image_tag || 'latest' }}"
          docker pull ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.docker_image_tag || 'latest' }}

      # 4️⃣ Run tests - Smoke
      - name: 🧪 Run Tests - Smoke
        if: ${{ github.event.inputs.test_suite == 'smoke' || github.event_name == 'schedule' }}
        run: |
          docker run --rm \
            -e ENV=${{ github.event.inputs.environment || 'qa' }} \
            -e CI=true \
            -e DOTENV_PRIVATE_KEY_QA=${{ secrets.DOTENV_PRIVATE_KEY_QA }} \
            -e DOTENV_PRIVATE_KEY_STAGE=${{ secrets.DOTENV_PRIVATE_KEY_STAGE }} \
            -e DOTENV_PRIVATE_KEY_PROD=${{ secrets.DOTENV_PRIVATE_KEY_PROD }} \
            -e DOTENV_PRIVATE_KEY_DEV=${{ secrets.DOTENV_PRIVATE_KEY_DEV }} \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/playwright-html-report:/app/playwright-html-report \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.docker_image_tag || 'latest' }} \
            npx playwright test --grep '@smoke'

      # 5️⃣ Run tests - Regression
      - name: 🧪 Run Tests - Regression
        if: ${{ github.event.inputs.test_suite == 'regression' }}
        run: |
          docker run --rm \
            -e ENV=${{ github.event.inputs.environment || 'qa' }} \
            -e CI=true \
            -e DOTENV_PRIVATE_KEY_QA=${{ secrets.DOTENV_PRIVATE_KEY_QA }} \
            -e DOTENV_PRIVATE_KEY_STAGE=${{ secrets.DOTENV_PRIVATE_KEY_STAGE }} \
            -e DOTENV_PRIVATE_KEY_PROD=${{ secrets.DOTENV_PRIVATE_KEY_PROD }} \
            -e DOTENV_PRIVATE_KEY_DEV=${{ secrets.DOTENV_PRIVATE_KEY_DEV }} \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/playwright-html-report:/app/playwright-html-report \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.docker_image_tag || 'latest' }} \
            npx playwright test --grep '@regression'

      # 6️⃣ Run tests - All
      - name: 🧪 Run Tests - All
        if: ${{ github.event.inputs.test_suite == 'all' }}
        run: |
          docker run --rm \
            -e ENV=${{ github.event.inputs.environment || 'qa' }} \
            -e CI=true \
            -e DOTENV_PRIVATE_KEY_QA=${{ secrets.DOTENV_PRIVATE_KEY_QA }} \
            -e DOTENV_PRIVATE_KEY_STAGE=${{ secrets.DOTENV_PRIVATE_KEY_STAGE }} \
            -e DOTENV_PRIVATE_KEY_PROD=${{ secrets.DOTENV_PRIVATE_KEY_PROD }} \
            -e DOTENV_PRIVATE_KEY_DEV=${{ secrets.DOTENV_PRIVATE_KEY_DEV }} \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/playwright-html-report:/app/playwright-html-report \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.docker_image_tag || 'latest' }} \
            npx playwright test

      # 7️⃣ Run tests - Specific file
      - name: 🧪 Run Tests - Specific File
        if: ${{ github.event.inputs.test_suite == 'specific' }}
        run: |
          docker run --rm \
            -e ENV=${{ github.event.inputs.environment || 'qa' }} \
            -e CI=true \
            -e DOTENV_PRIVATE_KEY_QA=${{ secrets.DOTENV_PRIVATE_KEY_QA }} \
            -e DOTENV_PRIVATE_KEY_STAGE=${{ secrets.DOTENV_PRIVATE_KEY_STAGE }} \
            -e DOTENV_PRIVATE_KEY_PROD=${{ secrets.DOTENV_PRIVATE_KEY_PROD }} \
            -e DOTENV_PRIVATE_KEY_DEV=${{ secrets.DOTENV_PRIVATE_KEY_DEV }} \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/playwright-html-report:/app/playwright-html-report \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.docker_image_tag || 'latest' }} \
            npx playwright test ${{ github.event.inputs.test_file }}

      # 8️⃣ Verify generated reports
      - name: 📊 Verify Generated Reports
        if: always()
        run: |
          echo "Allure results:"
          ls -R allure-results || echo "Allure results not found"
          echo "Playwright report:"
          ls -R playwright-report || echo "Playwright report not found"
          echo "Playwright HTML report:"
          ls -R playwright-html-report || echo "Playwright HTML report not found"

      # 9️⃣ Generate Allure Report
      - name: 📊 Generate Allure Report
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/allure-report:/app/allure-report \
            ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.docker_image_tag || 'latest' }} \
            npx allure generate allure-results --clean -o allure-report

      # 🔟 Upload artifacts
      - name: 📊 Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.event.inputs.environment || 'qa' }}
          path: allure-report/
          if-no-files-found: warn
          retention-days: 30

      - name: 📊 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.environment || 'qa' }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.event.inputs.environment || 'qa' }}
          path: playwright-html-report/
          if-no-files-found: warn
          retention-days: 30

  # ============================================
  # Publish Reports to GitHub Pages
  # ============================================
  publish-reports:
    name: 🌐 Publish Reports
    needs: docker-test
    runs-on: ubuntu-latest
    if: always()

    steps:
      # 1️⃣ Checkout repo
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Download artifacts
      - name: 📥 Download Allure Report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-report-${{ github.event.inputs.environment || 'qa' }}
          path: allure-report

      - name: 📥 Download Playwright Report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.environment || 'qa' }}
          path: playwright-report

      - name: 📥 Download Playwright HTML Report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-html-report-${{ github.event.inputs.environment || 'qa' }}
          path: playwright-html-report

      # 3️⃣ Verify downloaded reports
      - name: 📋 Verify Reports
        run: |
          echo "Allure report:"
          ls -R allure-report || echo "Not available"
          echo "Playwright report:"
          ls -R playwright-report || echo "Not available"
          echo "Playwright HTML report:"
          ls -R playwright-html-report || echo "Not available"

      # 4️⃣ Prepare reports for deployment
      - name: 📦 Prepare Reports for Deployment
        run: |
          mkdir -p gh-pages-deploy
          [ -d "allure-report" ] && cp -r allure-report gh-pages-deploy/ || echo "Skipping allure-report"
          [ -d "playwright-report" ] && cp -r playwright-report gh-pages-deploy/ || echo "Skipping playwright-report"
          [ -d "playwright-html-report" ] && cp -r playwright-html-report gh-pages-deploy/ || echo "Skipping playwright-html-report"
          echo "Combined reports:"
          ls -R gh-pages-deploy

      # 5️⃣ Publish to GitHub Pages
      - name: 🌐 Publish Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-deploy
          force_orphan: true

      # 6️⃣ Print report URLs
      - name: 🔗 Report URLs
        run: |
          echo "============================================"
          echo "📊 Reports Published Successfully!"
          echo "============================================"
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "Playwright Built-in: https://${{ github.repository_owner }}.github.io/${REPO_NAME}/playwright-report/index.html"
          echo "Playwright HTML Reporter: https://${{ github.repository_owner }}.github.io/${REPO_NAME}/playwright-html-report/index.html"
          echo "Allure: https://${{ github.repository_owner }}.github.io/${REPO_NAME}/allure-report/index.html"
          echo "============================================"

  # ============================================
  # Send Notifications
  # ============================================
  notify:
    name: 📬 Send Notifications
    runs-on: ubuntu-latest
    needs: [docker-test, publish-reports]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
      NOTIFICATION_EMAILS: ${{ secrets.NOTIFICATION_EMAILS }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ========== Determine Overall Status ==========
      - name: 🔍 Determine Pipeline Status
        id: status
        run: |
          TEST_RESULT="${{ needs.docker-test.result }}"
          ENV="${{ github.event.inputs.environment || 'qa' }}"
          SUITE="${{ github.event.inputs.test_suite || 'smoke' }}"

          echo "Test Result: $TEST_RESULT"
          echo "Environment: $ENV"
          echo "Test Suite: $SUITE"

          # Determine overall status
          if [[ "$TEST_RESULT" == "success" ]]; then
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "status_emoji=✅" >> $GITHUB_OUTPUT
            echo "status_color=#36a64f" >> $GITHUB_OUTPUT
            echo "status_text=All Tests Passed" >> $GITHUB_OUTPUT
          elif [[ "$TEST_RESULT" == "failure" ]]; then
            echo "overall_status=failure" >> $GITHUB_OUTPUT
            echo "status_emoji=❌" >> $GITHUB_OUTPUT
            echo "status_color=#dc3545" >> $GITHUB_OUTPUT
            echo "status_text=Tests Failed" >> $GITHUB_OUTPUT
          else
            echo "overall_status=warning" >> $GITHUB_OUTPUT
            echo "status_emoji=⚠️" >> $GITHUB_OUTPUT
            echo "status_color=#ffc107" >> $GITHUB_OUTPUT
            echo "status_text=Tests Partially Completed" >> $GITHUB_OUTPUT
          fi

          # Set test emoji
          if [[ "$TEST_RESULT" == "success" ]]; then
            echo "test_emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "test_emoji=❌" >> $GITHUB_OUTPUT
          fi

      # ========== Slack Notification ==========
      - name: 💬 Send Slack Notification
        id: slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.status_color }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${{ steps.status.outputs.status_emoji }} Docker Tests: ${{ steps.status.outputs.status_text }}",
                        "emoji": true
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n${{ github.repository }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Branch:*\n${{ github.ref_name }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Environment:*\n${{ github.event.inputs.environment || 'qa' }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Test Suite:*\n${{ github.event.inputs.test_suite || 'smoke' }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Triggered by:*\n${{ github.actor }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Docker Image:*\n${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.docker_image_tag || 'latest' }}"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Test Result:*\n${{ steps.status.outputs.test_emoji }} ${{ github.event.inputs.environment || 'qa' }}: ${{ needs.docker-test.result }}"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*📊 View Reports:*\n<https://axay-ops.github.io/E2E_LABS_PLAYWRIGHT_FW/playwright-report/index.html|Built-In HTML Report>\n<https://axay-ops.github.io/E2E_LABS_PLAYWRIGHT_FW/playwright-html-report/index.html|Playwright HTML Report>\n<https://axay-ops.github.io/E2E_LABS_PLAYWRIGHT_FW/allure-report/index.html|Allure Report>"
                      }
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run #${{ github.run_number }}>"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # ========== Email Notification ==========
      - name: 📧 Send Email Notification
        id: email
        if: ${{ secrets.NOTIFICATION_EMAILS != '' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.status_emoji }} Docker Tests: ${{ steps.status.outputs.status_text }} - ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAILS }}
          from: ${{ secrets.MAIL_FROM }}
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                .container { max-width: 600px; margin: 0 auto; padding: 20px; }
                .header { background: ${{ steps.status.outputs.status_color }}; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
                .content { background: #f9f9f9; padding: 20px; border-radius: 0 0 8px 8px; }
                .status-table { width: 100%; border-collapse: collapse; margin: 15px 0; }
                .status-table th, .status-table td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
                .status-table th { background: #ecf0f1; }
                .success { color: #27ae60; font-weight: bold; }
                .failure { color: #e74c3c; font-weight: bold; }
                .btn { display: inline-block; padding: 10px 20px; background: #3498db; color: white; text-decoration: none; border-radius: 5px; margin: 5px; }
                .btn:hover { background: #2980b9; }
                .footer { text-align: center; margin-top: 20px; color: #7f8c8d; font-size: 12px; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h1>🐳 Docker-Based Test Execution</h1>
                  <h2>${{ steps.status.outputs.status_text }}</h2>
                </div>
                <div class="content">
                  <h3>Pipeline Information</h3>
                  <table class="status-table">
                    <tr><th>Repository</th><td>${{ github.repository }}</td></tr>
                    <tr><th>Branch</th><td>${{ github.ref_name }}</td></tr>
                    <tr><th>Environment</th><td>${{ github.event.inputs.environment || 'qa' }}</td></tr>
                    <tr><th>Test Suite</th><td>${{ github.event.inputs.test_suite || 'smoke' }}</td></tr>
                    <tr><th>Docker Image</th><td>${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.docker_image_tag || 'latest' }}</td></tr>
                    <tr><th>Triggered by</th><td>${{ github.actor }}</td></tr>
                    <tr><th>Run Number</th><td>#${{ github.run_number }}</td></tr>
                  </table>

                  <h3>Test Results</h3>
                  <table class="status-table">
                    <tr>
                      <th>Environment</th>
                      <th>Status</th>
                    </tr>
                    <tr>
                      <td>🐳 ${{ github.event.inputs.environment || 'qa' }}</td>
                      <td class="${{ needs.docker-test.result == 'success' && 'success' || 'failure' }}">${{ needs.docker-test.result }}</td>
                    </tr>
                  </table>

                  <h3>📊 View Reports</h3>
                  <p>
                    <a href="https://axay-ops.github.io/E2E_LABS_PLAYWRIGHT_FW/playwright-report/index.html" class="btn">📊 Playwright Report</a>
                    <a href="https://axay-ops.github.io/E2E_LABS_PLAYWRIGHT_FW/allure-report/index.html" class="btn">📊 Allure Report</a>
                    <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="btn">🔗 View Workflow Run</a>
                  </p>
                </div>
                <div class="footer">
                  <p>🐳 This test was executed using Docker image: ${{ env.DOCKER_IMAGE }}</p>
                  <p>This is an automated notification from GitHub Actions.</p>
                  <p>Repository: ${{ github.repository }} | Run #${{ github.run_number }}</p>
                </div>
              </div>
            </body>
            </html>

      # ========== Notification Status Summary ==========
      - name: 📋 Notification Summary
        if: always()
        run: |
          echo "============================================"
          echo "📬 Notification Status"
          echo "============================================"
          echo "Slack: ${{ steps.slack.outcome || 'skipped' }}"
          echo "Email: ${{ steps.email.outcome || 'skipped' }}"
          echo "============================================"
