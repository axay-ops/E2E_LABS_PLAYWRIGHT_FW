# ========================================================================================
#                       DOCKER BUILD & PUSH TO DOCKER HUB
# ========================================================================================
# Trigger: Push to main branch / Manual workflow_dispatch
# Workflow: Build Docker Image → Push to Docker Hub with multiple tags
# ✅ Automatically builds on code changes
# ✅ Tags with latest, commit SHA, and version
# ✅ Pushes to Docker Hub
# ========================================================================================

name: Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'package*.json'
      - 'playwright.config.ts'
      - 'tests/**'
      - 'lib/**'
      - 'pages/**'
      - '.env.*'
      - 'data/**'
      - 'fixtures/**'
      - 'schemas/**'
      - 'utils/**'
      - '!.env.keys'

  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'package*.json'
      - 'playwright.config.ts'
      - 'tests/**'
      - 'lib/**'
      - 'pages/**'
      - '.env.*'
      - 'data/**'
      - 'fixtures/**'
      - 'schemas/**'
      - 'utils/**'
      - '!.env.keys'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional tag for the image (optional)'
        required: false
        default: ''
        type: string

      trigger_tests:
        description: 'Trigger test workflow after build?'
        required: false
        default: true
        type: boolean

      test_environment:
        description: 'Test environment (if tests triggered)'
        required: false
        default: 'qa'
        type: choice
        options:
          - qa
          - stage
          - prod
          - dev

      test_suite:
        description: 'Test suite (if tests triggered)'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all

env:
  DOCKER_IMAGE: axayhub/e2e-labs-playwright-fw-hubrepo

jobs:
  # ============================================
  # Build and Push Docker Image
  # ============================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx (for faster builds and multi-platform support)
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login to Docker Hub (only for push to main, not PRs)
      - name: 🔐 Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 4️⃣ Extract metadata (tags, labels)
      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr

      # 5️⃣ Build and push Docker image
      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Push to Docker Hub only on push to main, not on PRs
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ github.event.inputs.tag != '' && format('{0}:{1}', env.DOCKER_IMAGE, github.event.inputs.tag) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      # 6️⃣ Print image details
      - name: 📋 Image Details
        run: |
          echo "============================================"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "✅ Docker Image Successfully Built (PR Validation)"
            echo "============================================"
            echo "Event: Pull Request #${{ github.event.pull_request.number }}"
            echo "Status: Build validation passed"
            echo "Note: Image NOT pushed to Docker Hub (PR builds are for validation only)"
          else
            echo "🐳 Docker Image Successfully Built & Pushed!"
            echo "============================================"
            echo "Repository: ${{ env.DOCKER_IMAGE }}"
            echo "Tags:"
            echo "  - latest"
            echo "  - ${{ github.sha }}"
            [ -n "${{ github.event.inputs.tag }}" ] && echo "  - ${{ github.event.inputs.tag }}" || true
            echo "============================================"
            echo "📦 Pull command:"
            echo "docker pull ${{ env.DOCKER_IMAGE }}:latest"
            echo "============================================"
            echo "🔗 Docker Hub: https://hub.docker.com/r/${{ env.DOCKER_IMAGE }}"
          fi
          echo "============================================"

  # ============================================
  # Trigger Docker Tests (Optional)
  # ============================================
  trigger-tests:
    name: 🧪 Trigger Docker Tests
    needs: build-and-push
    runs-on: ubuntu-latest
    # Trigger tests if:
    # 1. Push event to main (auto-trigger)
    # 2. Manual dispatch with trigger_tests=true
    # 3. NOT on pull requests (PRs only validate build, don't run full tests)
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_tests == 'true')

    steps:
      - name: 🚀 Trigger Docker Tests Workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const environment = '${{ github.event.inputs.test_environment }}' || 'qa';
            const testSuite = '${{ github.event.inputs.test_suite }}' || 'smoke';
            const imageTag = '${{ github.event.inputs.tag }}' || 'latest';

            console.log('🚀 Triggering Docker Tests workflow...');
            console.log(`   Environment: ${environment}`);
            console.log(`   Test Suite: ${testSuite}`);
            console.log(`   Image Tag: ${imageTag}`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-tests.yml',
              ref: 'main',
              inputs: {
                environment: environment,
                test_suite: testSuite,
                docker_image_tag: imageTag
              }
            });

            console.log('✅ Docker Tests workflow triggered successfully!');
            console.log(`🔗 View at: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/docker-tests.yml`);
